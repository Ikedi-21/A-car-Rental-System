{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Change Password — Driftwood Motors Admin{% endblock %}

{% block content %}

<h4 class="mb-4">Change Password</h4>

<div class="dw-card p-4" style="max-width: 420px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="dw-label">Current Password</label>
            {{ form.old_password }}
        </div>
        <div class="mb-3">
            <label class="dw-label">New Password</label>
            {{ form.new_password1 }}
        </div>
        <div class="mb-4">
            <label class="dw-label">Confirm New Password</label>
            {{ form.new_password2 }}
        </div>
        <button type="submit" class="btn dw-btn-primary w-100">Update Password</button>
    </form>
</div>

{% endblock %}
