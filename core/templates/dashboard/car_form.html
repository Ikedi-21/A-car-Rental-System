{% extends 'admin_base.html' %}

{% block title %}{% if car %}Edit{% else %}Add{% endif %} Vehicle — Driftwood Motors Admin{% endblock %}

{% block content %}

<h4 class="mb-4">{% if car %}Edit Vehicle{% else %}Add New Vehicle{% endif %}</h4>

<div class="dw-card p-4" style="max-width: 700px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="dw-label">Brand</label>
                <select name="brand" class="dw-form-control" required>
                    <option value="">Select brand</option>
                    {% for brand in brands %}
                        <option value="{{ brand.id }}" {% if car and car.brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="dw-label">Model Name</label>
                <input type="text" name="name" class="dw-form-control" value="{{ car.name|default:'' }}" required>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="dw-label">Category</label>
                <select name="category" class="dw-form-control" required>
                    {% for value, label in category_choices %}
                        <option value="{{ value }}" {% if car and car.category == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="dw-label">Transmission</label>
                <select name="transmission" class="dw-form-control" required>
                    {% for value, label in transmission_choices %}
                        <option value="{{ value }}" {% if car and car.transmission == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="dw-label">Fuel Type</label>
                <select name="fuel_type" class="dw-form-control" required>
                    {% for value, label in fuel_choices %}
                        <option value="{{ value }}" {% if car and car.fuel_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="dw-label">Price per Day ($)</label>
                <input type="number" step="0.01" name="price_per_day" class="dw-form-control" value="{{ car.price_per_day|default:'' }}" required>
            </div>
            <div class="col-md-6">
                <label class="dw-label">Seats</label>
                <input type="number" name="seats" class="dw-form-control" value="{{ car.seats|default:4 }}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="dw-label">Description</label>
            <textarea name="description" class="dw-form-control" rows="4">{{ car.description|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="dw-label">Image</label>
            {% if car.image %}
                <div class="mb-2"><img src="{{ car.image.url }}" style="height: 60px; border-radius: 6px;"></div>
            {% endif %}
            <input type="file" name="image" class="dw-form-control" accept="image/*">
        </div>

        <div class="d-flex gap-4 mb-4">
            <div class="form-check">
                <input type="checkbox" name="is_available" class="form-check-input" id="isAvailable" {% if not car or car.is_available %}checked{% endif %}>
                <label class="form-check-label" for="isAvailable">Available for booking</label>
            </div>
            <div class="form-check">
                <input type="checkbox" name="is_featured" class="form-check-input" id="isFeatured" {% if car.is_featured %}checked{% endif %}>
                <label class="form-check-label" for="isFeatured">Featured on home page</label>
            </div>
        </div>

        <button type="submit" class="btn dw-btn-primary">{% if car %}Save Changes{% else %}Add Vehicle{% endif %}</button>
        <a href="{% url 'admin_car_list' %}" class="btn dw-btn-outline">Cancel</a>
    </form>
</div>

{% endblock %}
