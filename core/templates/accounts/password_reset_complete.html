{% extends 'base.html' %}

{% block title %}Password Reset Complete — Driftwood Motors{% endblock %}

{% block content %}

<div class="container dw-section dw-auth-wrap">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="dw-card p-4 p-md-5">
                <i class="bi bi-check-circle dw-text-accent" style="font-size: 2.5rem;"></i>
                <h3 class="mt-3 mb-2">Password Reset</h3>
                <p class="dw-text-muted">Your password has been changed successfully. You can now log in.</p>
                <a href="{% url 'login' %}" class="btn dw-btn-primary mt-3">Go to Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
