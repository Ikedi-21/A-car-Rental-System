{% extends 'base.html' %}

{% block title %}Check Your Email — Driftwood Motors{% endblock %}

{% block content %}

<!-- Shown right after submitting the reset request. Django redirects here
     regardless of whether the email actually exists in the DB — that's
     intentional on Django's part (prevents leaking which emails are
     registered), so the copy here is deliberately vague too. -->
<div class="container dw-section dw-auth-wrap">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="dw-card p-4 p-md-5">
                <i class="bi bi-envelope-check dw-text-accent" style="font-size: 2.5rem;"></i>
                <h3 class="mt-3 mb-2">Check Your Email</h3>
                <p class="dw-text-muted">
                    If an account exists with that email, we've sent a link to reset your password. It should arrive within a few minutes.
                </p>
                <a href="{% url 'login' %}" class="btn dw-btn-outline mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
